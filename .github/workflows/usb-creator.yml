name: Build USB Creator
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            label: windows-x64
          - os: macos-15-intel
            label: macos-intel
          - os: macos-15
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r creator/requirements-build.txt
      - run: python -m unittest discover -s creator -p "test_*.py" -v
      - name: Verify Windows native writer on disposable VHD
        if: runner.os == 'Windows'
        run: python creator/test_native_windows.py
      - name: Verify macOS native writer on disposable disk image
        if: runner.os == 'macOS'
        run: python creator/test_native_mac.py
      - name: Verify native GUI runtime
        run: python -c "import tkinter; r=tkinter.Tk(); r.update(); r.destroy()"
      - run: python creator/build.py
      - name: Smoke test packaged app
        shell: bash
        run: |
          python - <<'PYTHON'
          import pathlib, platform, subprocess
          path = pathlib.Path('dist/creator/CameraWall USB Creator.exe') if platform.system() == 'Windows' else pathlib.Path('dist/creator/CameraWall USB Creator.app/Contents/MacOS/CameraWall USB Creator')
          subprocess.run([str(path.resolve()), '--self-test'], check=True, timeout=30)
          PYTHON
      - name: Package application
        shell: bash
        run: python creator/package.py '${{ matrix.label }}'
      - uses: actions/upload-artifact@v4
        with:
          name: creator-${{ matrix.label }}
          path: dist/creator-packages/*
          if-no-files-found: error
