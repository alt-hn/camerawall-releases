# Leaving the USB plugged in must never reinstall a finished OS.
insmod part_gpt
insmod ext2
if search --no-floppy --file --set=cwroot /camerawall-installed.marker; then
 set root=$cwroot
 set prefix=($cwroot)/boot/grub
 configfile ($cwroot)/boot/grub/grub.cfg
 echo 'Installed CameraWall boot failed. Refusing to erase another disk.'
 halt
fi
set timeout=3
set default=0
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
menuentry 'CameraWall AUTO INSTALL - ERASE smallest non-boot disk (24 GiB minimum)' {
 linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/camerawall/preseed.cfg --- quiet
 initrd /install.amd/initrd.gz
}
menuentry 'CameraWall AUTO INSTALL - serial console (same unattended policy)' {
 linux /install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/camerawall/preseed.cfg console=ttyS0,115200n8 --- console=ttyS0,115200n8
 initrd /install.amd/initrd.gz
}
menuentry 'Power off' {
 halt
}
