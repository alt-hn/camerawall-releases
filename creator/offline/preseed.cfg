# Zero-input installation: smallest eligible non-boot disk is erased.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i netcfg/enable boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string camerawall
d-i netcfg/get_domain string local
d-i hw-detect/load_firmware boolean true
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string bookworm
d-i passwd/root-login boolean false
d-i passwd/user-fullname string CameraWall Administrator
d-i passwd/username string cwadmin
# Locked during OS setup; late-install creates a unique random password.
d-i passwd/user-password-crypted password !
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Ho_Chi_Minh
d-i clock-setup/ntp boolean false
d-i partman/early_command string /bin/sh /camerawall/mount-media.sh && /bin/sh /camerawall/select-disk.sh || while :; do sleep 3600; done
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/choose_label select gpt
d-i partman-efi/non_efi_system boolean true
# Disk guard supplies partition confirmations only after protecting non-target disks.
# Never automatically remove active LVM/RAID.
tasksel tasksel/first multiselect
d-i pkgsel/include string curl ca-certificates ffmpeg python3 sudo python3-venv libglib2.0-0 libgomp1 network-manager linux-image-amd64 libqt6gui6 libqt6opengl6 libqt6network6 qt6-qpa-plugins qt6-wayland gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav weston libgl1-mesa-dri fonts-dejavu-core
d-i pkgsel/upgrade select none
d-i popularity-contest/participate boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/cdrom/set-first boolean false
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true
d-i preseed/late_command string /bin/sh /camerawall/late-install.sh
d-i cdrom-detect/eject boolean false
d-i finish-install/reboot_in_progress note

d-i apt-setup/use_mirror boolean false
d-i apt-setup/services-select multiselect
